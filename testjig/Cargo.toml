[package]
name = "testjig"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anchor = { path = "../anchor", features = ["std", "shutdown-filtering"] }
tempfile = "3"
nix = { version = "0.25", features = ["term", "fs"] }
lazy_static = "1"
serde_json = "1"

[build-dependencies]
anchor_codegen = { path = "../anchor_codegen", features = ["shutdown-filtering"] }

[features]
skipped_command = []
